name: E2E

# De gegenereerde snippet moet ongewijzigd draaien in een echte Playwright-test
# (issue #19). Faalt de snippet, dan faalt deze workflow en blokkeert de PR.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Snippet draait in Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Chromium installeren
        run: npx playwright install --with-deps chromium

      - name: Extensie bouwen en E2E-tests draaien
        run: npm run test:e2e

      - name: Rapport bewaren bij een fout
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
