<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <title>Locator Picker testsite</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; margin: 24px; }
      section { margin-bottom: 24px; }
      .tile { display: inline-block; padding: 8px 12px; border: 1px solid #999; margin-right: 8px; }
    </style>
  </head>
  <body>
    <!-- Testsite voor de E2E-test (issue #19). Elk doel staat naast een
         lookalike, zodat een te losse locator meer dan één element vindt. -->
    <section>
      <h1>Inloggen</h1>
      <form onsubmit="document.title = 'verstuurd'; return false">
        <label>E-mail <input id="email" type="email" /></label>
        <button type="submit" data-testid="login">Inloggen</button>
        <button type="button">Annuleren</button>
      </form>
    </section>

    <section>
      <!-- Alleen data-cy: voor de optiespagina (testattribuut kiezen). -->
      <button type="button" data-cy="zoek">Zoeken</button>
    </section>

    <nav>
      <a href="#home">Home</a>
      <a href="#over">Over ons</a>
      <!-- Bevat 'Over ons' als deeltekst: zonder exact: true vindt getByRole beide links. -->
      <a href="#team">Over ons team</a>
    </nav>

    <section>
      <!-- Geen testattribuut, id, rol of naam: alleen een structurele XPath. -->
      <div><div><span class="tile">Tegel</span></div><div><span class="tile">Tegel</span></div></div>
    </section>
  </body>
</html>
